[build-system]
requires = ["flit_core>=3.12,<5"]
build-backend = "flit_core.buildapi"

[project]
name = "promptbrush"
dynamic = ["version"]
description = "Paint with prompts: a single-file CLI and Python library for OpenAI-compatible image APIs"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "zeroherolin" }]
requires-python = ">=3.10"
dependencies = ["requests>=2.27"]
keywords = ["image-generation", "openai", "gpt-image", "cli"]
classifiers = [
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
]

[project.urls]
Homepage = "https://github.com/zeroherolin/promptbrush"

[project.scripts]
promptbrush = "promptbrush:cli"

[tool.flit.sdist]
include = ["README.zh-CN.md", "test_promptbrush.py", "config.example", "prompt.example.md"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
